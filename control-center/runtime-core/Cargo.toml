[package]
name = "gary4local-core"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Shared native runtime and HTTP adapter core for gary4local"

[[bin]]
name = "gary4local-server"
path = "src/main.rs"

[[bin]]
name = "gary"
path = "src/bin/gary.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.22"
hound = "3.5"
socket2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
